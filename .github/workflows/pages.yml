name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without pushing, from the Actions tab.
  workflow_dispatch:

# The site is served from https://<owner>.github.io/<repo>/, so the build needs
# to know that sub-path. Change this if the repository is renamed, or set it to
# "/" when serving from the root of a custom domain.
env:
  VITE_BASE: /tmuh-nexus-template/

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead, and let an in-flight run finish
# rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so a broken build never reaches Pages.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
