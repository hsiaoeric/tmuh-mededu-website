# Manual, free alternative to hosted Supabase branches for database verification.
name: Verify Supabase database

on:
  workflow_dispatch:

env:
  SUPABASE_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Verify runner and tools
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          docker info
          test "$(supabase --version)" = "2.115.0"

      - name: Start local Postgres
        run: supabase db start

      - name: Reset local database
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run local pgTAP tests
        run: supabase test db --local

      - name: Collect failure diagnostics
        if: ${{ failure() }}
        run: |
          docker info
          docker system df
          docker ps -a
          df -h

      - name: Stop local Supabase
        if: ${{ always() }}
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
