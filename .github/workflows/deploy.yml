# Alternative publishing route, kept ready but not wired to pushes.
#
# This repository currently serves Pages from the `gh-pages` branch, which is
# published with `npm run deploy`. `actions/deploy-pages` below only works once
# Settings → Pages → Source is switched to "GitHub Actions" — until then a run
# would fail, so this is manual-dispatch only rather than on push.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# The site is served from https://<owner>.github.io/<repo>/, so the build needs
# to know that sub-path. Change this if the repository is renamed, or set it to
# "/" when serving from the root of a custom domain.
env:
  VITE_BASE: /tmuh-mededu-website/

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead, and let an in-flight run finish
# rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so a broken build never reaches Pages,
      # and the Vite config writes dist/404.html for SPA deep links.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
